jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: edge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip install pytest pytest-cov
      - run: pytest -v --cov=poultry_edge --cov-report=term-missing

  build-image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./edge
          file: ./edge/Dockerfile
          push: true
          tags: |
            ghcr.io/monicamorafenoll/poultry-edge:latest
            ghcr.io/monicamorafenoll/poultry-edge:${{ github.sha }}