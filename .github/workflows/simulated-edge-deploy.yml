name: Simulate Edge Deployment

on:
  workflow_dispatch:
    inputs:
      farm:
        description: Farm to deploy
        required: true
        type: choice
        default: farm_01
        options:
          - farm_01
          - farm_02

      image_tag:
        description: Docker image tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/monicamorafenoll/poultry-edge

jobs:
  deploy:
    name: Simulate Docker deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull "${IMAGE_NAME}:${{ inputs.image_tag }}"

      - name: Create simulated Edge
        run: |
          mkdir -p \
            "${{ runner.temp }}/poultry-edge/${{ inputs.farm }}/env"

      - name: Configure deployed image
        run: |
          echo "FARM_ID=${{ inputs.farm }}" \
            > "${{ runner.temp }}/poultry-edge/${{ inputs.farm }}/env/poultry-edge.env"

          echo "POULTRY_EDGE_IMAGE=${IMAGE_NAME}:${{ inputs.image_tag }}" \
            >> "${{ runner.temp }}/poultry-edge/${{ inputs.farm }}/env/poultry-edge.env"

      - name: Show deployed configuration
        run: |
          echo
          echo "Simulated Edge:"
          echo

          cat \
            "${{ runner.temp }}/poultry-edge/${{ inputs.farm }}/env/poultry-edge.env"

      - name: Verify Docker image
        run: |
          docker image inspect \
            "${IMAGE_NAME}:${{ inputs.image_tag }}" \
            --format='ID: {{.Id}}'

      - name: Show simulated Edge structure
        run: |
          echo
          echo "Simulated Edge structure:"
          echo

          find \
            "${{ runner.temp }}/poultry-edge/${{ inputs.farm }}" \
            -maxdepth 3 \
            -print

      - name: Prepare deployment evidence
        run: |
          mkdir -p deployment-evidence

          cp -r \
            "${{ runner.temp }}/poultry-edge/${{ inputs.farm }}" \
            deployment-evidence/

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: edge-deployment-${{ inputs.farm }}
          path: deployment-evidence/
          if-no-files-found: error