name: Test Edge Application

on:
  push:
    paths:
      - "edge/src/**"
      - "edge/tests/**"
      - "edge/pyproject.toml"
      - ".github/workflows/test-edge.yml"

  pull_request:
    paths:
      - "edge/src/**"
      - "edge/tests/**"
      - "edge/pyproject.toml"
      - ".github/workflows/test-edge.yml"

  workflow_dispatch:

jobs:
  test:
    name: Run Edge Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: edge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest -v --cov=poultry_edge --cov-report=term-missing