[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "poultry-edge"
version = "0.1.0"
description = "Daily edge inference pipeline for poultry farms"
requires-python = ">=3.11"

dependencies = [
    "mlflow>=3.0,<4.0",
    "PyYAML>=6.0,<7.0",
    "ultralytics>=8.3,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
poultry-edge = "poultry_edge.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]